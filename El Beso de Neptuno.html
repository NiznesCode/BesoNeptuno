    let kiss=false;
    parts.forEach(p=>{p.vy+=G*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.hit&&!p.done&&p.vy>=-40&&p.y<TY+22){p.done=true;kiss=true}});
    parts=parts.filter(p=>p.y<WY+10||p.vy<0);
    if(kiss&&st==='fly'){res='kiss';add(100);shake=8;end()}
    else if(st==='fly'&&!parts.some(p=>p.vy<0||p.y<WY)){res='half';add(20);end()}
  }
  if(shake>0)shake=Math.max(0,shake-dt*30);
  draw();requestAnimationFrame(loop);
}
function btn(o){x.fillStyle='#fff';x.strokeStyle='#2b2a33';x.lineWidth=2;x.beginPath();x.roundRect(o.x,o.y,o.w,o.h,12);x.fill();x.stroke();
  x.fillStyle='#2b2a33';x.font='bold 18px '+FONT;x.textAlign='center';x.fillText(o.l,o.x+o.w/2,o.y+o.h/2+6)}
function draw(){
  const t=tx(),menu=st==='lang'||st==='diff';
  x.save();if(shake)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  x.clearRect(0,0,W,H);x.fillStyle='#e8f6fb';x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(0,0,0,.06)';x.lineWidth=1;
  for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}
  for(let j=0;j<H;j+=40){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
  x.fillStyle='#fff';x.strokeStyle='#9aa5ad';x.lineWidth=3;
  x.beginPath();x.moveTo(70,300);x.lineTo(290,300);x.quadraticCurveTo(300,470,230,500);x.lineTo(130,500);x.quadraticCurveTo(60,470,70,300);x.fill();x.stroke();
  x.fillStyle='#4fb3e8';x.beginPath();x.moveTo(92,WY);x.lineTo(268,WY);x.quadraticCurveTo(272,478,226,492);x.lineTo(134,492);x.quadraticCurveTo(88,478,92,WY);x.fill();
  x.fillStyle=wet?'#e69a8f':'#f3b9a6';x.strokeStyle='#c98a78';x.lineWidth=2;
  [135,225].forEach(cx=>{x.beginPath();x.ellipse(cx,TY-5,48,52,0,0,7);x.fill();x.stroke()});
  x.fillStyle=wet?'#e69a8f':'#f3b9a6';x.fillRect(80,TY-60,200,30);
  if(wet){x.fillStyle='rgba(79,179,232,.55)';[[120,TY+20],[150,TY+30],[210,TY+25],[240,TY+15],[180,TY+38]].forEach(([a,b])=>{x.beginPath();x.ellipse(a,b,8,13,0,0,7);x.fill()})}
  const pulse=4*Math.sin(performance.now()/180);
  x.strokeStyle='#e0334c';x.lineWidth=2;x.setLineDash([5,4]);x.beginPath();x.arc(TX,TY+20,13+pulse*.4,0,7);x.stroke();x.setLineDash([]);
  x.fillStyle='#e0334c';x.font='bold 10px '+FONT;x.textAlign='center';x.fillText(t.tg,TX,TY+48);
  if(poop){x.fillStyle='#7a4a24';x.beginPath();x.ellipse(TX,poop.y,12,8,0,0,7);x.fill();x.beginPath();x.ellipse(TX,poop.y-7,8,6,0,0,7);x.fill();
    x.fillStyle='#fff';x.beginPath();x.arc(TX-4,poop.y-3,2.4,0,7);x.arc(TX+4,poop.y-3,2.4,0,7);x.fill();x.fillStyle='#000';x.beginPath();x.arc(TX-4,poop.y-3,1,0,7);x.arc(TX+4,poop.y-3,1,0,7);x.fill()}
  parts.forEach(p=>{x.fillStyle=p.hit?'#1f8fd8':'#6cc3f0';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});
  if(!menu){
    const bx=40,by=40,bw=280,bh=22,{c,w}=zone();
    x.fillStyle='#f4c542';x.fillRect(bx,by,bw*(c-w),bh);
    x.fillStyle='#46c15a';x.fillRect(bx+bw*(c-w),by,bw*2*w,bh);
    x.fillStyle='#e0334c';x.fillRect(bx+bw*(c+w),by,bw*(1-c-w),bh);
    x.strokeStyle='#2b2a33';x.lineWidth=2;x.strokeRect(bx,by,bw,bh);
    const px=bx+bw*(st==='aim'?bar:force);
    x.fillStyle='#2b2a33';x.beginPath();x.moveTo(px,by+bh+2);x.lineTo(px-8,by+bh+16);x.lineTo(px+8,by+bh+16);x.fill();
    x.font='bold 11px '+FONT;x.textAlign='left';x.fillText(t.lo,bx,by-6);x.textAlign='right';x.fillText(t.hi,bx+bw,by-6);
  }
  x.textAlign='center';
  if(st==='result'){
    const m=t[res]||['',''];
    x.fillStyle='rgba(20,20,30,.82)';x.beginPath();x.roundRect(15,120,330,110,14);x.fill();
    x.fillStyle='#fff';x.font='bold 20px '+FONT;x.fillText(m[0],180,160);
    x.font='13px '+FONT;x.fillText(m[1],180,186);x.fillStyle='#f4c542';
    x.fillText(round>=ROUNDS?t.fin.replace('{n}',score):t.nx,180,212);
    if(round>=ROUNDS){btns().forEach(btn);if(toast&&performance.now()-tt<4000){x.fillStyle='#2b2a33';x.font='bold 13px '+FONT;x.fillText(toast,180,310)}}
  }
  if(menu){
    x.fillStyle='rgba(20,20,30,.8)';x.fillRect(0,0,W,H);
    x.fillStyle='#fff';x.font='bold 26px '+FONT;x.fillText('🔱 '+t.t,180,70);
    x.font='15px '+FONT;x.fillStyle='#f4c542';
    x.fillText(st==='lang'?'Language · Idioma · 语言':t.diff,180,st==='lang'?130:115);
    btns().forEach(btn);
  }
  x.restore();
}
upd();requestAnimationFrame(loop);
</script>
